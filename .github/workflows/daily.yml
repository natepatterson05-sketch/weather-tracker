name: Daily collection
on:
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:
concurrency:
  group: weather-production
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Collect and report
        run: python pipeline.py run --issue
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "Collect weather snapshot $(date -u +%F)"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - name: Stage public files
        run: |
          mkdir -p _site/data
          cp index.html browse.html trends.html app.js style.css manifest.webmanifest sw.js icon-192.png icon-512.png _site/
          cp data/history.csv data/status.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
