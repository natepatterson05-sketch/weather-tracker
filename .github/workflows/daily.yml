name: Daily collection
on:
  schedule:
    - cron: '23 7,15 * * *'
    - cron: '47 21 * * *'
  workflow_dispatch:
concurrency:
  group: weather-production
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check whether today's snapshot is committed
        id: snapshot
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          today=$(date -u +%F)
          if [[ "$EVENT_NAME" == schedule ]] && python -c 'import json, sys; sys.exit(0 if json.load(open("data/status.json"))["run_time"].startswith(sys.argv[1]) else 1)' "$today"; then
            echo "collect=false" >> "$GITHUB_OUTPUT"
          else
            echo "collect=true" >> "$GITHUB_OUTPUT"
          fi
      - run: python -m pip install -r requirements-dev.txt
        if: steps.snapshot.outputs.collect == 'true'
      - run: python -m pytest
        if: steps.snapshot.outputs.collect == 'true'
      - name: Collect and report
        if: steps.snapshot.outputs.collect == 'true'
        run: python pipeline.py run --issue
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit snapshot
        if: steps.snapshot.outputs.collect == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "Collect weather snapshot $(date -u +%F)"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - name: Stage public files
        run: |
          mkdir -p _site/data
          cp index.html browse.html trends.html app.js style.css manifest.webmanifest sw.js icon-192.png icon-512.png _site/
          cp data/history.csv data/status.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
